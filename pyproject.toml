[project]
name = "kip"
version = "0.1.0"
description = "Engineering documents: Python in, vector PDF out."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "sympy>=1.13",
    "pint>=0.24",
    "handcalcs>=1.9",
    "typst>=0.13",
    "typer>=0.12",
    "rich>=13.0",
    "tomlkit>=0.13",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
cad = ["build123d>=0.9", "ezdxf>=1.3"]

[project.scripts]
kip = "kip.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:handcalcs.*",
    "ignore:.*PyparsingDeprecationWarning.*",
    "ignore::UserWarning:pyparsing.*",
]

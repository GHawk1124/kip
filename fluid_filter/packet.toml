# Section order follows the calculation report. Omitted settings keep Kip's defaults.
order = ["overview", "requirements", "inputs", "design", "preliminary", "analysis",
         "sizing", "manufacturing", "test", "compliance"]

[sections.overview]
title = "Design intent"
generate = false
columns = 1
[sections.requirements]
title = "Requirements and interpretation"
generate = false
columns = 1
[sections.inputs]
title = "Calculation constants"
generate = false
columns = 1
[sections.design]
title = "Architecture"
generate = false
columns = 1
[sections.preliminary]
title = "Flow basis"
generate = false
columns = 1
[sections.analysis]
title = "Pressure drop"
generate = false
columns = 1
[sections.sizing]
title = "Housing and mass"
generate = false
columns = 1
[sections.manufacturing]
title = "Manufacturing"
generate = false
columns = 1
[sections.test]
title = "Planned verification"
generate = false
columns = 1
[sections.compliance]
title = "Compliance"
generate = true
columns = 1

[sheets.constants]
path = "input/design.xlsx"
[sheets.references]
path = "input/design.xlsx"
sheet = "References"
stage = "requirements"
[sheets.documents]
enabled = false
[sheets.process]
path = "input/design.xlsx"
sheet = "Process"
[sheets.tests]
path = "input/design.xlsx"
sheet = "Tests"
optional = true
